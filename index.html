<!doctype html>
<html lang="en"> 
<head> 
   <meta charset="utf-8">
   <title> Accessibility exercise </title>
   <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.6.0/uicons-solid-straight/css/uicons-solid-straight.css'>
   <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.6.0/uicons-solid-rounded/css/uicons-solid-rounded.css'>
</head>
<body>
  <header>
    <h1> Accessibility exercises </h1>
  </header>
  <main>
    <h2> ARIA exercise 1 (before) </h2>
    
    <form>
          <fieldset>
            <legend> Contact us </legend>
            <div class="form-control">
              <label for="name">
                <i class="fi fi-ss-user" aria-hidden="true"></i>
              </label>
              <input type="text" id="name" aria-label="Name" />
            </div>

            <div class="form-control">
              <label for="email">
                <i class="fi fi-sr-email-pending" aria-hidden="true"></i>
              </label>
              <input type="text" id="email" aria-label="e-mail" />
            </div>

            <div class="form-control">
              <label for="message">
                <i class="fi fi-sr-messages" aria-hidden="true"></i>
              </label>
              <textarea id="message" cols="30" rows="10" aria-label="Message"></textarea>
            </div>

            <button type="submit" aria-label="Send">
              <i class="fi fi-ss-paper-plane-top" aria-hidden="true"></i>
            </button>
        </fieldset>
    </form>
    <img alt="Phone" src="https://img.icons8.com/small/2x/phone.png"/> +52 (333) 45 34 567
</main>
</body>
</html>

<style>
body {
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  background-color: #f4f7f8;
  color: #333;
  margin: 0;
  padding: 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

h1 {
  color: #2a9d8f;
  margin-bottom: 20px;
}

form {
  background-color: #fff;
  padding: 25px 30px;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
  max-width: 450px;
  width: 100%;
}

fieldset {
  border: 2px solid #2a9d8f;
  border-radius: 8px;
  padding: 20px;
}

legend {
  font-weight: bold;
  color: #264653;
  padding: 0 10px;
}

.form-control {
  display: flex;
  flex-direction: column;
  margin-bottom: 15px;
}

label {
  margin-bottom: 6px;
  font-weight: 500;
  color: #264653;
  font-size: 1.2rem;
}

input[type="text"],
textarea {
  padding: 10px;
  border: 2px solid #757575;
  border-radius: 6px;
  font-size: 1em;
  transition: border-color 0.3s, box-shadow 0.3s;
}

input[type="text"]:focus,
textarea:focus {
  border-color: #1E7167;
  box-shadow: 0 0 5px rgba(42, 157, 143, 0.3);
  outline: none;
}

button[type="submit"] {
  background-color: #20796F;
  color: white;
  border: none;
  border-radius: 6px;
  padding: 10px 20px;
  font-size: 1.2em;
  cursor: pointer;
  transition: background-color 0.3s ease;
  width: fit-content;
  display: flex;
  align-items: center;
  justify-content: center;
}

button[type="submit"]:hover {
  background-color: #21867a;
}

img {
  vertical-align: middle;
  width: 20px;
  margin-right: 8px;
  margin-top: 25px;
}

body > img + text,
body > img + span,
body > img + div {
  display: inline-block;
  vertical-align: middle;
}
</style>
